name: Sao lưu database Supabase

on:
  schedule:
    - cron: "0 19 * * *" # 19:00 UTC = 02:00 sáng giờ VN, mỗi ngày
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Cài PostgreSQL client 17
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Dump toàn bộ database
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          pg_dump -h db.fsjtjscpnmrsztyomyzg.supabase.co -p 5432 -U postgres -d postgres \
            --no-owner --no-acl -Fc -f "supabase-backup-$(date +%F).bin"

      - name: Upload backup làm artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: supabase-backup-*.bin
          retention-days: 30
